<!doctype html>
<html lang="si">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="robots" content="noindex, nofollow" />
  <title>හෙළ සිරිත · පරිපාලන මධ්‍යස්ථානය</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
  :root{
    --bg:#0b0f15; --bg2:#11161f; --card:#161c27; --card2:#1c2433; --line:#283041;
    --txt:#e7ecf3; --mut:#9aa6b8; --faint:#6b778c;
    --gold:#d8b56e; --gold2:#f0d495; --accent:#6ea8fe; --ok:#46b97e; --no:#e0664f; --warn:#e0b34f;
    --f:'Noto Sans Sinhala','Inter',system-ui,sans-serif; --fn:'Inter','Noto Sans Sinhala',sans-serif;
    --r:16px; --sh:0 18px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--f);background:radial-gradient(130% 100% at 80% -10%,#16203a 0%,#0b0f15 55%) fixed;color:var(--txt);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  .num{font-family:var(--fn)}
  .hidden{display:none!important}

  /* ── LOGIN ── */
  #login{min-height:100vh;display:grid;place-items:center;padding:1.2rem}
  .login-card{width:min(94vw,420px);background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:22px;padding:2.4rem 2rem;box-shadow:var(--sh)}
  .login-logo{width:64px;height:64px;border-radius:18px;margin:0 auto 1rem;display:grid;place-items:center;font-size:1.8rem;background:linear-gradient(135deg,var(--gold),#9a7838);box-shadow:0 10px 24px rgba(216,181,110,.3)}
  .login-card h1{text-align:center;font-size:1.5rem;font-weight:800;margin-bottom:.2rem}
  .login-card .sub{text-align:center;color:var(--mut);font-size:.92rem;margin-bottom:1.6rem}
  .field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1rem}
  .field label{font-size:.86rem;color:var(--mut);font-weight:600}
  .inp{width:100%;background:#0e131c;border:1.5px solid var(--line);border-radius:12px;padding:.8rem 1rem;color:var(--txt);font-family:inherit;font-size:1rem;transition:border-color .2s,box-shadow .2s}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(110,168,254,.16)}
  textarea.inp{resize:vertical;min-height:90px;line-height:1.6}
  select.inp{appearance:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:700;font-size:1rem;padding:.8rem 1.4rem;border-radius:12px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1f08;transition:transform .15s,box-shadow .25s,opacity .2s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(216,181,110,.3)}
  .btn:active{transform:none}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
  .btn.full{width:100%}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt)}
  .btn.ghost:hover{border-color:var(--accent);box-shadow:none}
  .btn.danger{background:linear-gradient(180deg,#f08a76,var(--no));color:#2a0f08}
  .btn.sm{padding:.5rem .9rem;font-size:.88rem;border-radius:10px}
  .err{color:var(--no);font-size:.9rem;margin-top:.4rem;min-height:1.2em;text-align:center}

  /* ── APP SHELL ── */
  #app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  .side{background:linear-gradient(180deg,#0e131c,#0b0f15);border-right:1px solid var(--line);padding:1.2rem .9rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem 1rem;font-weight:800;font-size:1.15rem}
  .brand .b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#9a7838);color:#2a1f08;font-size:1.1rem}
  .navgrp{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:.9rem .6rem .3rem}
  .navlink{display:flex;align-items:center;gap:.7rem;padding:.66rem .8rem;border-radius:11px;color:var(--mut);font-weight:600;font-size:.96rem;transition:background .2s,color .2s;text-align:left;width:100%}
  .navlink .ic{width:20px;text-align:center;opacity:.85}
  .navlink:hover{background:var(--card);color:var(--txt)}
  .navlink.active{background:linear-gradient(135deg,rgba(216,181,110,.18),rgba(216,181,110,.06));color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(216,181,110,.25)}
  .navlink .badge{margin-left:auto;background:var(--no);color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;padding:.05rem .45rem;font-family:var(--fn)}
  .side .spacer{flex:1}

  .main{padding:1.4rem clamp(1rem,3vw,2.2rem) 3rem;max-width:1100px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.4rem}
  .topbar .menu{display:none}
  .page-title{font-size:1.5rem;font-weight:800}
  .page-sub{color:var(--mut);font-size:.92rem}
  .who{display:flex;align-items:center;gap:.7rem;font-size:.88rem;color:var(--mut)}
  .who .live{display:inline-flex;align-items:center;gap:.4rem}
  .dotlive{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.4}}

  .panel{display:none}
  .panel.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:1.4rem;box-shadow:var(--sh);margin-bottom:1.2rem}
  .card h3{font-size:1.05rem;font-weight:700;margin-bottom:.2rem}
  .card .ch-sub{color:var(--mut);font-size:.86rem;margin-bottom:1rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  .row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
  .saved{color:var(--ok);font-size:.88rem;opacity:0;transition:opacity .3s}
  .saved.show{opacity:1}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.2rem}
  .stat{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;box-shadow:var(--sh)}
  .stat .v{font-family:var(--fn);font-size:2.2rem;font-weight:800;color:var(--gold2);line-height:1}
  .stat .l{color:var(--mut);font-size:.86rem;margin-top:.3rem}

  .toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
  .toggle:last-child{border-bottom:none}
  .sw{position:relative;width:48px;height:27px;border-radius:999px;background:#2a3344;transition:background .25s;flex:none}
  .sw.on{background:linear-gradient(90deg,var(--gold),#9a7838)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .25s}
  .sw.on::after{transform:translateX(21px)}

  .list{display:flex;flex-direction:column;gap:.7rem}
  .item{display:flex;gap:.9rem;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem}
  .item .meta{flex:1;min-width:0}
  .item .t{font-weight:700}
  .item .d{color:var(--mut);font-size:.86rem;word-break:break-word}
  .item img.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line)}
  .item .acts{display:flex;gap:.4rem;flex:none}
  .pill{font-size:.74rem;font-weight:700;padding:.12rem .6rem;border-radius:999px;font-family:var(--fn)}
  .pill.yes{background:rgba(70,185,126,.16);color:var(--ok)}
  .pill.no{background:rgba(224,102,79,.16);color:var(--no)}
  .pill.pend{background:rgba(224,179,79,.16);color:var(--warn)}
  .empty{color:var(--faint);text-align:center;padding:1.4rem;font-style:italic}

  .uploader{border:1.6px dashed var(--line);border-radius:14px;padding:1.4rem;text-align:center;color:var(--mut);transition:border-color .2s,background .2s}
  .uploader:hover{border-color:var(--gold);background:rgba(216,181,110,.05)}
  .preview{width:100%;max-width:300px;border-radius:14px;border:1px solid var(--line);margin:.8rem auto 0;display:block}
  .filterbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  .chip{padding:.45rem .9rem;border-radius:999px;border:1.5px solid var(--line);font-size:.88rem;font-weight:600;color:var(--mut);background:transparent;transition:all .2s}
  .chip.active{border-color:var(--gold);color:var(--gold2);background:rgba(216,181,110,.1)}
  .toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(20px);background:#1c2433;border:1px solid var(--line);color:var(--txt);padding:.8rem 1.3rem;border-radius:12px;box-shadow:var(--sh);opacity:0;transition:all .3s;z-index:60;font-size:.92rem}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--no)}

  /* mobile */
  @media(max-width:860px){
    #app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .3s;height:100vh}
    .side.open{transform:none}
    .topbar .menu{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card)}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;opacity:0;pointer-events:none;transition:opacity .3s}
    .scrim.show{opacity:1;pointer-events:auto}
  }
  </style>
</head>
<body>

  <!-- ════ LOGIN ════ -->
  <div id="login">
    <div class="login-card">
      <div class="login-logo">🪔</div>
      <h1>හෙළ සිරිත</h1>
      <div class="sub">පරිපාලන මධ්‍යස්ථානය · ආරක්ෂිත පිවිසුම</div>
      <div class="field">
        <label for="email">විද්‍යුත් තැපෑල</label>
        <input class="inp" id="email" type="email" autocomplete="username" inputmode="email" placeholder="gaurawasachintha@gmail.com" />
      </div>
      <div class="field">
        <label for="pass">මුරපදය</label>
        <input class="inp" id="pass" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button class="btn full" id="loginBtn">පිවිසෙන්න</button>
      <button class="btn ghost full" id="resetBtn" style="margin-top:.7rem;font-size:.86rem">මුරපදය අමතකද? නැවත සැකසීමේ සබැඳියක් එවන්න</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>

  <!-- ════ APP ════ -->
  <div id="app" class="hidden">
    <aside class="side" id="side">
      <div class="brand"><span class="b">🪔</span> හෙළ සිරිත</div>
      <div class="navgrp">මුල් පිටුව</div>
      <button class="navlink active" data-go="dashboard"><span class="ic">▤</span> දළ විශ්ලේෂණය</button>
      <button class="navlink" data-go="details"><span class="ic">✦</span> මංගල තොරතුරු</button>
      <button class="navlink" data-go="couple"><span class="ic">❤</span> මනාල යුවළ පින්තූරය</button>
      <div class="navgrp">ආගන්තුකයෝ</div>
      <button class="navlink" data-go="guests"><span class="ic">+</span> ආගන්තුක නාම ලේඛනය</button>
      <button class="navlink" data-go="rsvp"><span class="ic">✓</span> පැමිණීම් පිළිතුරු</button>
      <div class="navgrp">අන්තර්ගතය</div>
      <button class="navlink" data-go="agenda"><span class="ic">≣</span> වැඩසටහන</button>
      <button class="navlink" data-go="gallery"><span class="ic">▦</span> ඡායාරූප එකතුව</button>
      <button class="navlink" data-go="blessings"><span class="ic">✉</span> සුබ පැතුම් <span class="badge hidden" id="blBadge">0</span></button>
      <div class="spacer"></div>
      <button class="navlink" id="logoutBtn"><span class="ic">⎋</span> ඉවත් වන්න</button>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <div class="topbar">
        <button class="menu" id="menuBtn" aria-label="මෙනුව">☰</button>
        <div style="flex:1">
          <div class="page-title" id="pageTitle">දළ විශ්ලේෂණය</div>
          <div class="page-sub" id="pageSub"></div>
        </div>
        <div class="who"><span class="live"><span class="dotlive"></span>සජීවී</span><span id="whoEmail"></span></div>
      </div>

      <section class="panel active" data-panel="dashboard" id="p-dashboard"></section>
      <section class="panel" data-panel="details" id="p-details"></section>
      <section class="panel" data-panel="couple" id="p-couple"></section>
      <section class="panel" data-panel="guests" id="p-guests"></section>
      <section class="panel" data-panel="rsvp" id="p-rsvp"></section>
      <section class="panel" data-panel="agenda" id="p-agenda"></section>
      <section class="panel" data-panel="gallery" id="p-gallery"></section>
      <section class="panel" data-panel="blessings" id="p-blessings"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
