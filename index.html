<!doctype html>
<html lang="si">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1813" />
  <meta name="robots" content="noindex, nofollow" />
  <title>හෙළ සිරිත · පරිපාලන පුවරුව</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dzrfpc9be/image/upload/v1781121609/admin_favison_i1rrxp.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* ════════════════════════════════════════════════════════════════════════
 *  හෙළ සිරිත · ADMIN STYLES  ·  assets/css/admin.css
 *  Modern, clean, functional control panel. Light content + brass-accented
 *  dark sidebar. Fully responsive (sidebar → drawer on phones/tablets).
 * ════════════════════════════════════════════════════════════════════════ */

:root {
  --gold:#C9A574; --gold-d:#A48354; --ink:#1d1a14; --bg:#f4f1ea; --panel:#ffffff;
  --line:#e7e1d3; --muted:#7d766a; --sidebar:#1b1813; --sidebar-2:#241f17;
  --ok:#2f8f5b; --warn:#c08a1e; --bad:#c0473b;
  --r:14px; --shadow:0 12px 34px -22px rgba(40,30,10,.5);
  --font:"Noto Sans Sinhala","Segoe UI",system-ui,-apple-system,sans-serif;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font-family:var(--font); background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%; }
img { max-width:100%; display:block; }
a { color:inherit; text-decoration:none; }
button,input,select,textarea { font-family:inherit; }
code { background:#eee7d6; padding:1px 6px; border-radius:6px; font-size:.86em; }

/* ───────────── buttons / inputs (shared) ───────────── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:.5em; border:1px solid var(--line);
  background:#fff; color:var(--ink); padding:.7em 1.15em; border-radius:10px; font-weight:600; cursor:pointer; transition:.2s; }
.btn:hover { transform:translateY(-1px); box-shadow:var(--shadow); }
.btn.primary { background:linear-gradient(135deg,#E7CE97,#C9A574 60%,#A48354); color:#241a05; border-color:transparent; }
.btn.ghost { background:transparent; }
.btn.danger { color:#fff; background:var(--bad); border-color:transparent; }
.btn.ok { color:#fff; background:var(--ok); border-color:transparent; }
.btn.sm { padding:.45em .8em; font-size:.85rem; }
.btn.xs { padding:.32em .6em; font-size:.78rem; border-radius:8px; }
.btn:disabled { opacity:.6; cursor:default; transform:none; }
.input { width:100%; padding:.7em .85em; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-size:.95rem; }
.input:focus { outline:2px solid color-mix(in srgb,var(--gold) 70%, transparent); border-color:var(--gold); }
.field { display:grid; gap:6px; margin-bottom:14px; }
.field label { font-weight:600; font-size:.9rem; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.muted { color:var(--muted); font-size:.9rem; }

.switch { display:inline-flex; align-items:center; gap:10px; cursor:pointer; user-select:none; margin:6px 0; }
.switch input { display:none; }
.switch span { width:42px; height:24px; border-radius:999px; background:#d8d1c2; position:relative; transition:.2s; flex:0 0 auto; }
.switch span::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s; }
.switch input:checked + span { background:var(--gold); }
.switch input:checked + span::after { transform:translateX(18px); }
.switch.big { display:flex; justify-content:flex-start; padding:10px 0; border-bottom:1px solid var(--line); font-weight:600; }

/* ───────────── LOGIN ───────────── */
#login { min-height:100svh; display:grid; place-items:center; padding:24px;
  background:radial-gradient(900px 500px at 50% -10%, color-mix(in srgb,var(--gold) 26%, transparent), transparent 60%), var(--sidebar); }
.login-card { width:100%; max-width:400px; background:var(--panel); border-radius:18px; padding:34px 28px; box-shadow:0 30px 80px -30px #000; }
.login-card .logo { width:64px; height:64px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(135deg,#E7CE97,#A48354); color:#241a05; font-weight:800; font-size:1.4rem; }
.login-card h1 { text-align:center; margin:.2em 0; font-size:1.4rem; }
.login-card .sub { text-align:center; color:var(--muted); margin:0 0 18px; font-size:.92rem; }
.g-btn { width:100%; gap:10px; }
.g-btn svg { width:20px; height:20px; }
.divider-or { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.82rem; margin:16px 0; }
.divider-or::before, .divider-or::after { content:""; flex:1; height:1px; background:var(--line); }
.login-err { color:var(--bad); font-size:.88rem; min-height:1.2em; text-align:center; margin-top:10px; }
.login-foot { text-align:center; margin-top:14px; font-size:.82rem; color:var(--muted); }
.link-btn { background:none; border:none; color:var(--gold-d); cursor:pointer; font-size:.85rem; padding:0; }

/* ───────────── APP SHELL ───────────── */
#app { display:grid; grid-template-columns:264px 1fr; min-height:100svh; }
/* the [hidden] attribute must win over the #login/#app display rules above,
   otherwise the signed-out app renders below the login card (ID beats [hidden]). */
#login[hidden], #app[hidden] { display:none !important; }
#sidebar { background:var(--sidebar); color:#e9e2d2; display:flex; flex-direction:column; position:sticky; top:0; height:100svh; overflow:auto; }
.side-brand { padding:20px 18px; font-weight:800; font-size:1.15rem; letter-spacing:.04em; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--sidebar-2); }
.side-brand .dot { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#E7CE97,#A48354); flex:0 0 auto; }
#nav { padding:10px 10px 20px; flex:1; }
.nav-group { margin-top:14px; }
.nav-group-label { font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:#8c8473; padding:6px 10px; }
.nav-item { width:100%; display:flex; align-items:center; gap:10px; padding:.7em .8em; border:none; background:none; color:#d8d1bf; border-radius:10px; cursor:pointer; text-align:start; font-size:.92rem; }
.nav-item svg { width:18px; height:18px; opacity:.8; flex:0 0 auto; }
.nav-item:hover { background:var(--sidebar-2); color:#fff; }
.nav-item.active { background:linear-gradient(135deg,#E7CE97,#A48354); color:#241a05; font-weight:700; }
.nav-item.active svg { opacity:1; }
.side-foot { padding:14px; border-top:1px solid var(--sidebar-2); }
.whoami { font-size:.78rem; color:#9b9485; margin-bottom:8px; word-break:break-all; }

#content { display:flex; flex-direction:column; min-width:0; }
.topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px; padding:14px 22px;
  background:color-mix(in srgb,var(--bg) 92%, #fff); border-bottom:1px solid var(--line); backdrop-filter:blur(6px); }
.topbar .crumb { font-weight:700; font-size:1.05rem; }
.topbar .spacer { flex:1; }
#menuBtn { display:none; }
#main { padding:22px; overflow:auto; }

/* ───────────── module head + panels ───────────── */
.mod-head { margin-bottom:16px; }
.mod-head h1 { margin:0; font-size:1.5rem; }
.mod-head p { margin:4px 0 0; color:var(--muted); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; margin-bottom:18px; box-shadow:var(--shadow); }
.panel h3 { margin:0 0 12px; font-size:1.1rem; }
.panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.sm-input { max-width:240px; }

/* stats */
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; }
.stat { padding:16px; border-radius:12px; background:#faf7f0; border:1px solid var(--line); text-align:center; }
.stat .n { font-size:2rem; font-weight:800; line-height:1; }
.stat .l { color:var(--muted); font-size:.85rem; margin-top:6px; }
.stat.ok .n { color:var(--ok); } .stat.warn .n { color:var(--warn); } .stat.bad .n { color:var(--bad); }
.split { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.split-name { font-weight:800; margin-bottom:8px; }
.split-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); }
.big-total { font-weight:800; color:var(--gold-d); }

/* tables */
.tbl-scroll { overflow:auto; }
.tbl { width:100%; border-collapse:collapse; font-size:.92rem; }
.tbl th, .tbl td { text-align:start; padding:.6em .7em; border-bottom:1px solid var(--line); white-space:nowrap; }
.tbl th { color:var(--muted); font-weight:700; font-size:.82rem; }
.mini { padding:.35em .5em; border:1px solid var(--line); border-radius:8px; background:#fff; }
.chip { padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:700; }
.chip.ok { background:#e3f3ea; color:var(--ok); } .chip.warn { background:#f7eed6; color:var(--warn); } .chip.bad { background:#f7e0dd; color:var(--bad); }

/* lines (agenda/blessings/budget) */
.line { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
.line:last-child { border-bottom:0; }
.line-actions { display:flex; gap:6px; flex:0 0 auto; }

/* color rows */
.color-row { display:flex; gap:8px; align-items:center; }
.color-row input[type=color] { width:46px; height:40px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:2px; }
.preset-row { display:flex; gap:8px; flex-wrap:wrap; }

/* gallery */
.gal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
.gal-cell { position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
.gal-cell img { width:100%; aspect-ratio:1; object-fit:cover; }
.gal-cell .del { position:absolute; top:6px; right:6px; }
.progress { height:8px; background:#eee; border-radius:999px; overflow:hidden; margin:10px 0; }
.progress .bar { height:100%; width:0; background:linear-gradient(90deg,#E7CE97,#A48354); transition:width .2s; }

/* qr */
.qr-stage { display:grid; place-items:center; padding:14px; }
.qr-stage img { border:1px solid var(--line); border-radius:12px; background:#fff; }

/* toast */
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:#241f17; color:#fff; padding:12px 20px; border-radius:999px; font-size:.92rem; z-index:200; transition:.3s; box-shadow:0 16px 40px -16px #000; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#toast.bad { background:var(--bad); } #toast.warn { background:var(--warn); }

#scrim { display:none; }

/* ───────────── responsive ───────────── */
@media (max-width:900px) {
  #app { grid-template-columns:1fr; }
  #sidebar { position:fixed; z-index:50; width:280px; left:0; top:0; transform:translateX(-100%); transition:transform .3s; }
  #sidebar.open { transform:none; box-shadow:0 0 60px rgba(0,0,0,.5); }
  #menuBtn { display:inline-flex; }
  #scrim { display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; opacity:0; pointer-events:none; transition:.3s; }
  #sidebar.open ~ #content #scrim, body:has(#sidebar.open) #scrim { opacity:1; pointer-events:auto; }
  .grid2 { grid-template-columns:1fr; }
  .split { grid-template-columns:1fr; }
}
@media (max-width:520px) { #main { padding:14px; } .topbar { padding:12px 14px; } .login-card { padding:26px 20px; } }

/* ───────────── login logo (image) + brand mark ───────────── */
.login-card .logo {
  width:78px; height:78px; padding:0; overflow:hidden;
  background:linear-gradient(135deg,#E7CE97,#A48354);
  box-shadow:0 10px 26px -12px rgba(164,131,84,.8), 0 0 0 4px color-mix(in srgb,var(--gold) 26%, transparent);
}
.login-card .logo img { width:100%; height:100%; object-fit:cover; }
.brand-ic { width:32px; height:32px; border-radius:50%; flex:0 0 auto; object-fit:cover; box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 32%, transparent); }

/* ───────────── confirm / alert modal ───────────── */
.modal { position:fixed; inset:0; z-index:300; display:none; place-items:center; padding:20px;
  background:rgba(20,16,8,.55); backdrop-filter:blur(3px); }
.modal.show { display:grid; animation:mfade .18s ease; }
@keyframes mfade { from { opacity:0 } to { opacity:1 } }
.modal-card { width:100%; max-width:380px; background:var(--panel); border-radius:18px; padding:26px 24px; text-align:center;
  box-shadow:0 30px 80px -28px #000; animation:mpop .2s cubic-bezier(.2,.8,.2,1); }
@keyframes mpop { from { transform:translateY(10px) scale(.97); opacity:.6 } to { transform:none; opacity:1 } }
.modal-ic { width:54px; height:54px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center; font-size:1.5rem; }
.modal-ic.danger { background:#f7e0dd; color:var(--bad); }
.modal-ic.ask { background:#f3ecd9; color:var(--gold-d); }
.modal-title { margin:.2em 0; font-size:1.2rem; }
.modal-msg { color:var(--muted); margin:0 0 18px; }
.modal-actions { display:flex; gap:10px; }
.modal-actions .btn { flex:1; justify-content:center; }

/* ───────────── visual polish (modern, non-traditional) ───────────── */
.stat { position:relative; overflow:hidden; background:linear-gradient(180deg,#fff,#faf6ee); }
.stat::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,#E7CE97,#A48354); opacity:.75; }
.panel { background:linear-gradient(180deg,#fff,#fffdf8); }
.panel h3 { position:relative; padding-left:12px; }
.panel h3::before { content:""; position:absolute; left:0; top:.15em; bottom:.15em; width:3px; border-radius:2px; background:linear-gradient(180deg,#E7CE97,#A48354); }
.nav-item.active { box-shadow:0 8px 20px -12px rgba(201,165,116,.95); }
.topbar { box-shadow:0 1px 0 color-mix(in srgb,var(--gold) 28%, transparent); }
.topbar .crumb { color:#3a3326; }
.tbl tbody tr:hover { background:#faf7f0; }
.mini:focus { outline:2px solid color-mix(in srgb,var(--gold) 65%, transparent); border-color:var(--gold); }

/* ───────────────────────── THEME + VISIBILITY modules ─────────────────── */
.thm-list,.vis-list { display:flex; flex-direction:column; }
.thm-row,.vis-row { display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.thm-row:last-child,.vis-row:last-child { border-bottom:0; }
.thm-meta,.vis-meta { min-width:0; flex:1 1 200px; }
.thm-label,.vis-label { font-weight:600; line-height:1.4; }
.thm-hint,.vis-hint { font-size:.82rem; line-height:1.5; margin-top:2px; }
.thm-pick { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.thm-color { width:46px; height:38px; padding:0; border:1px solid var(--line); border-radius:10px;
  background:#fff; cursor:pointer; flex:0 0 auto; }
.thm-color::-webkit-color-swatch-wrapper { padding:3px; }
.thm-color::-webkit-color-swatch { border:none; border-radius:7px; }
.thm-hex { width:104px; text-transform:uppercase; letter-spacing:.04em; font-family:ui-monospace,Menlo,Consolas,monospace; }
.thm-preview { margin-top:18px; border-radius:16px; overflow:hidden; border:1px solid var(--line); }
.thm-prev-card { padding:30px 22px; text-align:center;
  background:var(--p-surface,#FFFBF2); color:var(--p-text,#221C01);
  background-image:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--p-secondary,#F2E5C6) 70%,transparent),transparent 70%); }
.thm-prev-ay { font-size:.78rem; letter-spacing:.34em; text-transform:uppercase; color:var(--p-accent,#A48354); }
.thm-prev-names { font-size:1.9rem; font-weight:700; margin:8px 0 6px; color:var(--p-primary,#C9A574);
  text-shadow:0 1px 0 color-mix(in srgb,var(--p-accent,#A48354) 40%,transparent); }
.thm-prev-line { font-size:.95rem; opacity:.85; }
.thm-actions { display:flex; justify-content:flex-end; margin-top:16px; }
@media (max-width:520px){
  .thm-pick { width:100%; justify-content:space-between; }
  .thm-actions .btn { flex:1; }
}

</style>
</head>
<body>

  <!-- ░░ LOGIN ░░ -->
  <section id="login">
    <div class="login-card">
      <div class="logo"><img src="https://res.cloudinary.com/dzrfpc9be/image/upload/v1781121609/admin_favison_i1rrxp.png" alt="හෙළ සිරිත" /></div>
      <h1>හෙළ සිරිත · පරිපාලනය</h1>
      <p class="sub">පිවිසීමට අවසර ඇත්තේ පරිපාලක ගිණුමට පමණි.</p>

      <button id="googleBtn" class="btn g-btn">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.5l-6.5-5.5C29.7 34.6 27 35.5 24 35.5c-5.2 0-9.6-3.3-11.2-7.9l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6.5 5.5C40.9 36 44 30.6 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
        Google ගිණුමෙන් පිවිසෙන්න
      </button>

      <div class="divider-or">නැතහොත්</div>

      <form id="loginForm">
        <div class="field"><label for="email">ඊමේල්</label><input class="input" id="email" type="email" autocomplete="username" placeholder="gaurawasachintha@gmail.com" /></div>
        <div class="field"><label for="password">මුරපදය</label><input class="input" id="password" type="password" autocomplete="current-password" /></div>
        <button id="loginSubmit" class="btn primary" style="width:100%" type="submit">පිවිසෙන්න</button>
      </form>

      <p class="login-err" id="loginErr"></p>
      <p class="login-foot"><button class="link-btn" id="forgotBtn" type="button">මුරපදය අමතකද?</button></p>
    </div>
  </section>

  <!-- ░░ APP ░░ -->
  <div id="app" hidden>
    <aside id="sidebar">
      <div class="side-brand"><img class="brand-ic" src="https://res.cloudinary.com/dzrfpc9be/image/upload/v1781121609/admin_favison_i1rrxp.png" alt="" /> හෙළ සිරිත</div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div class="whoami" id="whoami"></div>
        <button id="logoutBtn" class="btn" style="width:100%">පිටවීම (Logout)</button>
      </div>
    </aside>

    <div id="content">
      <header class="topbar">
        <button id="menuBtn" class="btn ghost" aria-label="මෙනුව">☰</button>
        <span class="crumb" id="crumb">දළ විශ්ලේෂණය</span>
        <span class="spacer"></span>
        <a class="btn ghost sm" href="https://helasiritha.vercel.app" target="_blank" rel="noopener">පොදු අඩවිය ↗</a>
      </header>
      <main id="main"></main>
    </div>
  </div>

  <div id="scrim"></div>
